name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: bash tests/run.sh
      - name: ShellCheck
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck -S warning install.sh hooks/*.sh tests/*.sh
