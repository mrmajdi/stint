<svg xmlns="http://www.w3.org/2000/svg" width="860" height="390" viewBox="0 0 860 390" role="img" aria-label="Before and after: usage 100% to 47%, median chat history 411k to 97k tokens, biggest cache write 928k to 136k tokens.">
<title>Before and after: usage 100% to 47%, median chat history 411k to 97k tokens, biggest cache write 928k to 136k tokens.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>

</defs>
<rect x="0.5" y="0.5" width="859" height="389" rx="16" fill="url(#bg)" stroke="#30363d"/>
<text x="40" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#e6edf3" text-anchor="start">Same work, with stint</text>
<text x="40" y="78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start">Replay of 30 days of real logs · an estimate, not a promise</text>
<rect x="600" y="40" width="14" height="14" rx="3" fill="#6e7681"/>
<text x="622" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start">Before</text>
<rect x="700" y="40" width="14" height="14" rx="3" fill="#3fb950"/>
<text x="722" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start">With stint</text>
<text x="40" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="start">Usage for the same work</text>
<text x="40" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#6e7681" text-anchor="start"></text>
<rect x="300" y="116" width="440.0" height="16" rx="8.0" fill="#6e7681"/>
<text x="752" y="129" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#8b949e" text-anchor="start">100%</text>
<rect x="300" y="140" width="206.8" height="16" rx="8.0" fill="#3fb950"/>
<text x="518.8" y="153" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#3fb950" text-anchor="start">47%</text>
<text x="40" y="204" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="start">Chat history per message</text>
<text x="40" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#6e7681" text-anchor="start">median</text>
<rect x="300" y="190" width="440.0" height="16" rx="8.0" fill="#6e7681"/>
<text x="752" y="203" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#8b949e" text-anchor="start">411k</text>
<rect x="300" y="214" width="103.8" height="16" rx="8.0" fill="#3fb950"/>
<text x="415.8442822384428" y="227" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#3fb950" text-anchor="start">97k</text>
<text x="40" y="278" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="start">Biggest single cache write</text>
<text x="40" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#6e7681" text-anchor="start">one message</text>
<rect x="300" y="264" width="440.0" height="16" rx="8.0" fill="#6e7681"/>
<text x="752" y="277" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#8b949e" text-anchor="start">928k</text>
<rect x="300" y="288" width="64.5" height="16" rx="8.0" fill="#3fb950"/>
<text x="376.48275862068965" y="301" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#3fb950" text-anchor="start">136k</text>
<text x="40" y="358" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8b949e">About <tspan fill="#3fb950" font-weight="700">half the usage</tspan>, or about <tspan fill="#3fb950" font-weight="700">twice the work</tspan> per usage limit.</text>
</svg>
