<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-label="Usage limit warning: at 83% of the 5-hour window, stint tells the agent to update the handoff note, and the agent saves it.">
<title>Usage limit warning: at 83% of the 5-hour window, stint tells the agent to update the handoff note, and the agent saves it.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>

</defs>
<rect x="0.5" y="0.5" width="999" height="309" rx="16" fill="url(#bg)" stroke="#30363d"/>
<rect x="30" y="30" width="380" height="250" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="54" y="66" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8b949e" text-anchor="start" letter-spacing="1.5">USAGE LIMITS</text>
<text x="54" y="104" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="start">5-hour window</text>
<text x="386" y="104" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#d29922" text-anchor="end">83%</text>
<rect x="54" y="116" width="332" height="10" rx="5.0" fill="#21262d"/><rect x="54" y="116" width="275.6" height="10" rx="5.0" fill="#d29922"/>
<text x="54" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#6e7681" text-anchor="start">Resets at 14:00</text>
<text x="54" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="start">Weekly</text>
<text x="386" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#58a6ff" text-anchor="end">47%</text>
<rect x="54" y="208" width="332" height="10" rx="5.0" fill="#21262d"/><rect x="54" y="208" width="156.0" height="10" rx="5.0" fill="#58a6ff"/>
<text x="54" y="240" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#6e7681" text-anchor="start">Resets Fri 09:00</text>
<text x="440" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start">At 80%, 90% and 95%, the agent is told once:</text>
<rect x="440" y="66" width="530" height="92" rx="12" fill="#211a0b" stroke="#d29922"/>
<path d="M462 98l9-16l9 16z" fill="none" stroke="#d29922" stroke-width="2" stroke-linejoin="round"/>
<text x="490" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#d29922" text-anchor="start">stint</text>
<text x="462" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">You have used 83% of the 5-hour window (resets at 14:00).</text>
<text x="462" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">Update .stint/handoff.md now, before continuing.</text>
<text x="440" y="192" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start">The agent saves the work first:</text>
<rect x="440" y="206" width="530" height="74" rx="12" fill="#161b22" stroke="#30363d"/>
<text x="462" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">Saved .stint/handoff.md. If the limit stops this chat,</text>
<text x="462" y="258" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">a new chat continues from: “write the email job”.</text>
</svg>
