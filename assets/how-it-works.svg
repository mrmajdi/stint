<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-label="How stint works: chat 1 saves a handoff note while it works; chat 2 starts from the note. A usage limit warning tells the agent to save now.">
<title>How stint works: chat 1 saves a handoff note while it works; chat 2 starts from the note. A usage limit warning tells the agent to save now.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker>
</defs>
<rect x="0.5" y="0.5" width="999" height="269" rx="16" fill="url(#bg)" stroke="#30363d"/>
<rect x="40" y="110" width="250" height="130" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="60" y="145" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="start">Chat 1</text>
<text x="60" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start">working on the task</text>
<rect x="60" y="192" width="210" height="10" rx="5.0" fill="#21262d"/><rect x="60" y="192" width="190.0" height="10" rx="5.0" fill="#d97757"/>
<text x="60" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#6e7681" text-anchor="start">history grows with every message</text>
<rect x="375" y="118" width="250" height="114" rx="12" fill="#1f1611" stroke="#d97757"/>
<path d="M397 136h22l8 8v30h-30z" fill="none" stroke="#d97757" stroke-width="2"/>
<text x="440" y="156" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="start">.stint/handoff.md</text>
<text x="397" y="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#e8a98c" text-anchor="start">goal · done · decisions</text>
<text x="397" y="220" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#e8a98c" text-anchor="start">dead ends · next steps</text>
<rect x="710" y="110" width="250" height="130" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="730" y="145" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="start">Chat 2</text>
<text x="730" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start">fresh and small</text>
<rect x="730" y="192" width="210" height="10" rx="5.0" fill="#21262d"/><rect x="730" y="192" width="50.0" height="10" rx="5.0" fill="#3fb950"/>
<text x="730" y="226" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#6e7681" text-anchor="start">starts from the note, not the history</text>
<path d="M292 175H368" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
<text x="330" y="165" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle">saves as</text>
<text x="330" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle">it works</text>
<path d="M627 175H703" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
<text x="665" y="165" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle">loaded at</text>
<text x="665" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle">chat start</text>
<rect x="40" y="28" width="250" height="44" rx="22" fill="#211a0b" stroke="#d29922"/>
<path d="M62 60l10-18l10 18z" fill="none" stroke="#d29922" stroke-width="2" stroke-linejoin="round"/>
<text x="92" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#d29922" text-anchor="start">Usage limit 80 · 90 · 95%</text>
<path d="M165 74V104" stroke="#d29922" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr)"/>
<text x="178" y="94" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#d29922" text-anchor="start">save the note now</text>
<text x="960" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8b949e" text-anchor="end">Any agent can read the note:</text>
<text x="960" y="78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#e6edf3" text-anchor="end">Claude Code · Codex · Gemini CLI · Cursor</text>
</svg>
